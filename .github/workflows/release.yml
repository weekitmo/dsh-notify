name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - name: Verify release
        run: |
          pnpm run check
          git diff --exit-code -- lib
      - name: Build release artifacts
        run: |
          pnpm pack --pack-destination dist
          cp install.sh dist/install.sh
          pnpm run release:notes --version "${GITHUB_REF_NAME#v}" --output dist/release-notes.md
          (cd dist && sha256sum *.tgz install.sh > SHA256SUMS)
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.ref_name }}
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$GITHUB_REF_NAME — desktop, Tab & sidebar task notifications"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" --repo "$REPO" ./*.tgz install.sh SHA256SUMS --clobber
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$REPO" ./*.tgz install.sh SHA256SUMS --verify-tag --prerelease --title "$TITLE" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$REPO" ./*.tgz install.sh SHA256SUMS --verify-tag --title "$TITLE" --notes-file release-notes.md
          fi
